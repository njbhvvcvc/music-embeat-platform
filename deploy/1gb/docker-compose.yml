version: "3.8"

# 1GB 内存优化版 - 单语种子集 + Qdrant（轻量） + 全套服务
# 适合：Koyeb 付费小档 / 1GB VPS / 任何 1GB 环境
# 导入时用 --cn-only / --jp-only / --en-only / --kr-only 选一个语种

networks:
  embeat-net:
    driver: bridge

volumes:
  qdrant-data:
    driver: local
  postgres-data:
    driver: local

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - GD_API_BASE=${GD_API_BASE:-https://music-api.gdstudio.xyz/api.php}
      - GD_API_RATE_LIMIT=${GD_API_RATE_LIMIT:-50}
      - GD_API_RATE_WINDOW=${GD_API_RATE_WINDOW:-300}
      - EMBEAT_BASE=http://embeat:7860
      - PROFILE_BASE=http://profile:8090
    depends_on:
      embeat:
        condition: service_healthy
      profile:
        condition: service_healthy
    networks:
      - embeat-net
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  embeat:
    build:
      context: ./embeat-service
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - EMBEAT_PORT=${EMBEAT_PORT:-7860}
      - EMBEAT_MODEL_PATH=${EMBEAT_MODEL_PATH:-/app/checkpoints/EmbeatMLP}
      - EMBEAT_DISABLE_TRACK2VEC=${EMBEAT_DISABLE_TRACK2VEC:-true}
      - EMBEAT_TOP_K=${EMBEAT_TOP_K:-20}
      - EMBEAT_CHANNELS=${EMBEAT_CHANNELS:-similar,popular,same_artist,related_artist}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-embeat_cn}
    volumes:
      - ./embeat-service/checkpoints:/app/checkpoints:ro
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - embeat-net
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "7860", "--workers", "1"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7860/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage:z
      - ./deploy/1gb/qdrant/config.yaml:/qdrant/config/config.yaml:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - embeat-net
    restart: unless-stopped
    # 子集很小，内存占用低
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  profile:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PROFILE_PORT=${PROFILE_PORT:-8090}
      - POSTGRES_DB=${POSTGRES_DB:-embeat_profile}
      - POSTGRES_USER=${POSTGRES_USER:-embeat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - EMBEAT_BASE=http://embeat:7860
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - embeat-net
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "1"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data:z
      - ./deploy/1gb/postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-embeat_profile}
      - POSTGRES_USER=${POSTGRES_USER:-embeat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
    networks:
      - embeat-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embeat -d embeat_profile"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
