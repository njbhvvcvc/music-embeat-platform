server {
    listen 80;
    server_name _;

    # 前端健康检查（nginx 直接返回，需要自带 CORS，避免全局加在 /api 造成重复头）
    location = /health {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;
        if ($request_method = OPTIONS) { return 204; }
        return 200 '{"status":"ok","service":"nginx"}';
    }

    # API 网关反代：CORS 由网关 FastAPI 中间件统一输出（含 OPTIONS 预检），nginx 不叠加头，避免重复值冲突
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qdrant 面板（可选，生产可注释）
    location /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_set_header Host $host;
    }

    # 前端静态文件
    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;
        if ($request_method = OPTIONS) { return 204; }
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}