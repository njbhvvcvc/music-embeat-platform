server {
    listen 80;
    server_name _;

    # 全局 CORS 头
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length" always;

    # OPTIONS 预检请求统一处理
    if ($request_method = OPTIONS) {
        return 204;
    }

    # 前端健康检查
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # API 网关反代
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qdrant 面板（可选，生产可注释）
    location /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_set_header Host $host;
    }

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
