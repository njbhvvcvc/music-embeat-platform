# PostgreSQL 配置 - RAW 4GB 优化版
# 大幅降低内存占用，适合小规格 VPS

# 必须监听所有接口，否则其他容器连不上（默认只监听 localhost）
listen_addresses = '*'

# 内存相关（保守设置）
shared_buffers = 64MB          # 默认 128MB，降到 64MB
effective_cache_size = 256MB   # 查询规划器提示，不影响实际内存
work_mem = 4MB                 # 每个排序/哈希操作的内存
maintenance_work_mem = 32MB    # VACUUM/索引创建
max_connections = 20           # 限制连接数

# WAL 设置（降低写入放大）
wal_buffers = 1MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.5
min_wal_size = 32MB
max_wal_size = 256MB

# 其他
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
