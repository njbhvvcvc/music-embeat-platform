# Qdrant 配置 - 低内存优化版
# 核心：用内存映射代替 RAM 存储向量，导入时不开索引
# 注意：所有值必须为合法类型（字符串/数字），否则 Qdrant 启动失败

storage:
  memmap_threshold: 0          # 0 = 所有向量用 mmap（不占 RAM）
  wal_capacity_mb: 32

service:
  grpc_port: 6334
  http_port: 6333
  max_request_size_mb: 32
  request_timeout_sec: 30

# 关闭遥测
telemetry_disabled: true

# 日志级别
log_level: INFO
